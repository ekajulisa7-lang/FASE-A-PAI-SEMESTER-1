    // Parser pintar untuk membaca teks firebaseConfig langsung dari console.firebase.google.com
    const parseFirebaseConfigInput = (rawText) => {
      if (!rawText || typeof rawText !== 'string') return null;
      const trimmed = rawText.trim();
      if (!trimmed) return null;

      try {
        const parsed = JSON.parse(trimmed);
        if (parsed && parsed.apiKey && parsed.projectId) {
          return {
            apiKey: String(parsed.apiKey || '').trim(),
            authDomain: String(parsed.authDomain || `${parsed.projectId}.firebaseapp.com`).trim(),
            projectId: String(parsed.projectId || '').trim(),
            storageBucket: String(parsed.storageBucket || '').trim(),
            messagingSenderId: String(parsed.messagingSenderId || '').trim(),
            appId: String(parsed.appId || '').trim()
          };
        }
      } catch (e) {
        // Lanjut ke ekstraksi regex untuk format JS object dari Firebase Console
      }

      const extractField = (fieldName) => {
        const regex = new RegExp(`${fieldName}\\s*:\\s*["'\`]([^"'\`]+)["'\`]`, 'i');
        const match = trimmed.match(regex);
        return match ? match[1].trim() : '';
      };

      const apiKey = extractField('apiKey');
      const projectId = extractField('projectId');
      if (!apiKey || !projectId) return null;

      return {
        apiKey,
        authDomain: extractField('authDomain') || `${projectId}.firebaseapp.com`,
        projectId,
        storageBucket: extractField('storageBucket'),
        messagingSenderId: extractField('messagingSenderId'),
        appId: extractField('appId')
      };
    };

    // Mendeteksi konfigurasi Firebase dari berbagai sumber
    const resolveActiveFirebaseConfig = () => {
      try {
        const params = new URLSearchParams(window.location.search);
        const fbParam = params.get('fb');
        if (fbParam) {
          const decoded = JSON.parse(atob(decodeURIComponent(fbParam)));
          if (decoded && decoded.apiKey && decoded.projectId) {
            localStorage.setItem(LS_KEYS.FB_CONFIG, JSON.stringify(decoded));
            return { config: decoded, source: 'link-guru' };
          }
        }
      } catch (e) {
        console.warn('Gagal membaca parameter fb dari URL:', e);
      }

      try {
        const saved = localStorage.getItem(LS_KEYS.FB_CONFIG);
        if (saved) {
          const parsed = JSON.parse(saved);
          if (parsed && parsed.apiKey && parsed.projectId) {
            return { config: parsed, source: 'saved' };
          }
        }
      } catch (e) {}

      if (DEFAULT_FIREBASE_CONFIG.apiKey && DEFAULT_FIREBASE_CONFIG.projectId) {
        return { config: DEFAULT_FIREBASE_CONFIG, source: 'default' };
      }

      if (typeof window.__firebase_config !== 'undefined' && window.__firebase_config) {
        try {
          const envCfg = typeof window.__firebase_config === 'string'
            ? JSON.parse(window.__firebase_config)
            : window.__firebase_config;
          if (envCfg && envCfg.apiKey && envCfg.projectId) {
            return { config: envCfg, source: 'gemini-env' };
          }
        } catch (e) {}
      }

      return { config: null, source: 'none' };
    };

    const COLLECTION_MAP = {
      profiles: 'pai_ceria_profiles',
      scores: 'pai_ceria_scores',
      aas_submissions: 'pai_ceria_aas'
    };

    const LOCAL_KEY_MAP = {
      profiles: LS_KEYS.PROFILES,
      scores: LS_KEYS.SCORES,
      aas_submissions: LS_KEYS.AAS
    };

    const enqueuePendingSync = (item) => {
      const queue = readLocalList(LS_KEYS.PENDING_QUEUE);
      const filtered = queue.filter((q) => !(q.collectionName === item.collectionName && q.docId === item.docId));
      filtered.push(item);
      writeLocalList(LS_KEYS.PENDING_QUEUE, filtered);
    };

    const writeDocumentToFirestore = async (db, sdk, collectionName, docId, payload) => {
      const fbCollectionName = COLLECTION_MAP[collectionName] || collectionName;
      await sdk.setDoc(sdk.doc(db, fbCollectionName, docId), payload, { merge: true });
    };

    const saveRecord = async (db, appId, collectionName, payload, docId = null) => {
      const sdk = window.__FB_SDK__;
      const recordId = docId || 'rec_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
      const dataWithId = {
        id: recordId,
        deviceId: getDeviceId(),
        ...payload
      };

      const lsKey = LOCAL_KEY_MAP[collectionName];
      if (lsKey) {
        const currentList = readLocalList(lsKey);
        const existingIdx = currentList.findIndex((x) => x.id === recordId);
        if (existingIdx >= 0) {
          currentList[existingIdx] = { ...currentList[existingIdx], ...dataWithId };
        } else {
          currentList.push(dataWithId);
        }
        writeLocalList(lsKey, currentList);
      }

      if (db && sdk) {
        try {
          await writeDocumentToFirestore(db, sdk, collectionName, recordId, dataWithId);
          return { synced: true, id: recordId };
        } catch (err) {
          console.warn('Firestore write queued for retry:', err);
          enqueuePendingSync({ collectionName, docId: recordId, payload: dataWithId });
          return { synced: false, id: recordId };
        }
      } else {
        enqueuePendingSync({ collectionName, docId: recordId, payload: dataWithId });
        return { synced: false, id: recordId };
      }
    };

    // --- KOMPONEN GENERIK GAME MENJODOHKAN DUA KOLOM ---
    const TwoColumnMatchGame = ({ title, instruction, pairs, leftKey, rightKey, chapterId, gameModeName, db, appId, user, profile, onBack, onFinish }) => {
      const safePairs = useMemo(() => (Array.isArray(pairs) ? pairs : []), [pairs]);
      const [selectedLeft, setSelectedLeft] = useState(null);
      const [matchedIds, setMatchedIds] = useState({});
      const [wrongFlash, setWrongFlash] = useState('');
      const [isFinished, setIsFinished] = useState(false);
      const [isSaving, setIsSaving] = useState(false);

      const shuffledRight = useMemo(() => {
        const copy = [...safePairs];
        for (let i = copy.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [copy[i], copy[j]] = [copy[j], copy[i]];
        }
        return copy;
      }, [safePairs]);

      const handleRightClick = async (item) => {
        if (!selectedLeft || matchedIds[item.id]) return;

        if (selectedLeft.id === item.id) {
          const nextMatched = { ...matchedIds, [item.id]: true };
          setMatchedIds(nextMatched);
          setSelectedLeft(null);
          setWrongFlash('');

          if (Object.keys(nextMatched).length === safePairs.length) {
            setIsFinished(true);
            setIsSaving(true);
            await saveRecord(db, appId, 'scores', {
              userId: user?.uid || getDeviceId(),
              studentName: profile.fullName,
              grade: profile.grade,
              chapterId,
              type: 'game',
              gameMode: gameModeName,
              score: 100,
              timestamp: Date.now()
            });
            setIsSaving(false);
          }
        } else {
          setWrongFlash('Pasangan belum tepat, coba pilih pasangan lainnya ya!');
          setSelectedLeft(null);
        }
      };

      if (safePairs.length === 0) {
        return (
          <div className="max-w-md mx-auto pt-16 px-4 text-center">
            <Card>
              <p className="font-bold text-gray-600 mb-4">Data permainan sedang disiapkan.</p>
              <Button onClick={onBack} className="w-full">Kembali</Button>
            </Card>
          </div>
        );
      }

      if (isFinished) {
        return (
          <div className="max-w-md mx-auto pt-16 px-4 text-center">
            <Card className="border-4 border-emerald-200">
              <div className="text-7xl mb-3">🏆🌟</div>
              <h2 className="text-2xl sm:text-3xl font-black text-emerald-800 mb-2">Hebat Sekali!</h2>
              <p className="text-gray-600 mb-4">Kamu berhasil memasangkan semua kartu dengan tepat!</p>
              <div className="text-6xl font-black text-yellow-500 mb-6">100</div>
              {isSaving ? (
                <p className="text-gray-400 animate-pulse">Menyimpan skor ke Guru...</p>
              ) : (
                <div className="space-y-3">
                  <Button variant="secondary" onClick={onBack} className="w-full">Pilih Game Lainnya</Button>
                  <Button variant="outline" onClick={onFinish} className="w-full">Kembali ke Bab</Button>
                </div>
              )}
            </Card>
          </div>
        );
      }

      return (
        <div className="max-w-4xl mx-auto pt-6 px-4 pb-12">
          <Header
            title={title}
            subtitle={`Terjodohkan: ${Object.keys(matchedIds).length} / ${safePairs.length}`}
            onBack={onBack}
          />
          <p className="text-center font-bold text-gray-700 bg-white p-3 rounded-2xl shadow-2xs border border-emerald-100 mb-5 text-xs sm:text-sm">
            {instruction}
          </p>

          {wrongFlash && (
            <div className="mb-4 bg-red-100 border border-red-300 text-red-800 font-bold text-xs sm:text-sm p-3 rounded-2xl text-center">
              ⚠️ {wrongFlash}
            </div>
          )}

          <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div className="space-y-3">
              <h3 className="font-black text-emerald-900 text-center text-sm uppercase tracking-wider">1. Pilih Kartu Kiri</h3>
              {safePairs.map((item) => {
                const isMatched = !!matchedIds[item.id];
                const isSelected = selectedLeft?.id === item.id;
                return (
                  <button
                    key={item.id}
                    disabled={isMatched}
                    onClick={() => {
                      setSelectedLeft(item);
                      setWrongFlash('');
                    }}
                    className={`w-full p-4 rounded-2xl border-2 text-left font-bold transition cursor-pointer ${
                      isMatched
                        ? 'bg-emerald-100 border-emerald-400 text-emerald-800 opacity-60 cursor-default'
                        : isSelected
                        ? 'bg-amber-300 border-amber-600 text-amber-950 scale-[1.02] shadow-md'
                        : 'bg-white border-emerald-200 hover:border-emerald-500 text-gray-900'
                    }`}
                  >
                    <div className="flex items-center justify-between gap-2">
                      <span className="text-base sm:text-lg">{item[leftKey]}</span>
                      {isMatched && <span>✅</span>}
                    </div>
                  </button>
                );
              })}
            </div>

            <div className="space-y-3">
              <h3 className="font-black text-sky-900 text-center text-sm uppercase tracking-wider">2. Pilih Pasangannya di Kanan</h3>
              {shuffledRight.map((item) => {
                const isMatched = !!matchedIds[item.id];
                return (
                  <button
                    key={item.id}
                    disabled={isMatched}
                    onClick={() => handleRightClick(item)}
                    className={`w-full p-4 rounded-2xl border-2 text-left font-bold transition cursor-pointer ${
                      isMatched
                        ? 'bg-emerald-100 border-emerald-400 text-emerald-800 opacity-60 cursor-default'
                        : 'bg-sky-50/70 border-sky-200 hover:border-sky-500 hover:bg-sky-100 text-gray-900'

    // --- GAME 1: KUIS CEPAT ---
    const QuizGame = ({ chapter, db, appId, user, profile, onBack, onFinish }) => {
      const questions = CHAPTER_DATA[chapter.id]?.quizGame || [];
      const [qIdx, setQIdx] = useState(0);
      const [score, setScore] = useState(0);
      const [selectedOpt, setSelectedOpt] = useState(null);
      const [isFinished, setIsFinished] = useState(false);
      const [isSaving, setIsSaving] = useState(false);

      const currentQ = questions[qIdx];

      const handleAnswer = async (optIdx) => {
        if (selectedOpt !== null) return;
        setSelectedOpt(optIdx);
        const isCorrect = optIdx === currentQ.ans;
        const nextScore = isCorrect ? score + Math.round(100 / questions.length) : score;
        if (isCorrect) setScore(nextScore);

        setTimeout(async () => {
          if (qIdx < questions.length - 1) {
            setQIdx(qIdx + 1);
            setSelectedOpt(null);
          } else {
            const finalScore = isCorrect && qIdx === questions.length - 1 && nextScore > 95 ? 100 : nextScore;
            setScore(finalScore);
            setIsFinished(true);
            setIsSaving(true);
            await saveRecord(db, appId, 'scores', {
              userId: user?.uid || getDeviceId(),
              studentName: profile.fullName,
              grade: profile.grade,
              chapterId: chapter.id,
              type: 'game',
              gameMode: 'Kuis Cepat',
              score: finalScore,
              timestamp: Date.now()
            });
            setIsSaving(false);
          }
        }, 850);
      };

      if (isFinished) {
        return (
          <div className="max-w-md mx-auto pt-16 px-4 text-center">
            <Card className="border-4 border-amber-200">
              <div className="text-7xl mb-3">🎉🏆</div>
              <h2 className="text-2xl sm:text-3xl font-black text-emerald-900 mb-2">Kuis Selesai!</h2>
              <p className="text-gray-600 mb-4">Skor Kuis Cepat kamu adalah:</p>
              <div className="text-6xl font-black text-amber-500 mb-6">{score}</div>
              {isSaving ? (
                <p className="text-gray-400 animate-pulse">Menyimpan skor ke Guru...</p>
              ) : (
                <div className="space-y-3">
                  <Button variant="secondary" onClick={onBack} className="w-full">Pilih Game Lainnya</Button>
                  <Button variant="outline" onClick={onFinish} className="w-full">Kembali ke Bab</Button>
                </div>
              )}
            </Card>
          </div>
        );
      }

      return (
        <div className="max-w-2xl mx-auto pt-6 px-4 pb-12">
          <Header title="Kuis Cepat" subtitle={`Soal ${qIdx + 1} dari ${questions.length}`} onBack={onBack} />
          <Card>
            <h3 className="text-lg sm:text-xl font-black text-gray-900 mb-6">{currentQ.q}</h3>
            <div className="space-y-3">
              {currentQ.options.map((opt, idx) => {
                let btnStyle = 'bg-emerald-50 border-emerald-200 hover:border-emerald-500 text-gray-900';
                if (selectedOpt !== null) {
                  if (idx === currentQ.ans) btnStyle = 'bg-emerald-500 border-emerald-700 text-white';
                  else if (idx === selectedOpt) btnStyle = 'bg-red-500 border-red-700 text-white';
                }
                return (
                  <button
                    key={idx}
                    onClick={() => handleAnswer(idx)}
                    className={`w-full p-4 rounded-2xl border-2 text-left font-bold transition cursor-pointer ${btnStyle}`}
                  >
                    {String.fromCharCode(65 + idx)}. {opt}
                  </button>
                );
              })}
            </div>
          </Card>
        </div>
      );
    };

    // --- GAME 2: KELOMPOKKAN KARTU (DUA KATEGORI) ---
    const GroupSortGame = ({ title, instruction, items, leftGroup, rightGroup, leftLabel, rightLabel, chapterId, gameModeName, db, appId, user, profile, onBack, onFinish }) => {
      const safeItems = useMemo(() => (Array.isArray(items) ? items : []), [items]);
      const shuffledItems = useMemo(() => {
        const copy = [...safeItems];
        for (let i = copy.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [copy[i], copy[j]] = [copy[j], copy[i]];
        }
        return copy;
      }, [safeItems]);

      const [idx, setIdx] = useState(0);
      const [correctCount, setCorrectCount] = useState(0);
      const [feedback, setFeedback] = useState(null);
      const [isFinished, setIsFinished] = useState(false);
      const [isSaving, setIsSaving] = useState(false);

      if (shuffledItems.length === 0) {
        return (
          <div className="max-w-md mx-auto pt-16 px-4 text-center">
            <Card>
              <p className="font-bold text-gray-600 mb-4">Data permainan sedang disiapkan.</p>
              <Button onClick={onBack} className="w-full">Kembali</Button>
            </Card>
          </div>
        );
      }

      const currentItem = shuffledItems[idx];

      const handleChoose = async (chosenGroup) => {
        if (feedback !== null) return;
        const isCorrect = chosenGroup === currentItem.group;
        const nextCorrect = isCorrect ? correctCount + 1 : correctCount;
        if (isCorrect) setCorrectCount(nextCorrect);
        setFeedback(isCorrect ? 'correct' : 'wrong');

        setTimeout(async () => {
          setFeedback(null);
          if (idx < shuffledItems.length - 1) {
            setIdx(idx + 1);
          } else {
            const finalScore = Math.round((nextCorrect / shuffledItems.length) * 100);
            setIsFinished(true);
            setIsSaving(true);
            await saveRecord(db, appId, 'scores', {
              userId: user?.uid || getDeviceId(),
              studentName: profile.fullName,
              grade: profile.grade,
              chapterId,
              type: 'game',
              gameMode: gameModeName,
              score: finalScore,
              timestamp: Date.now()
            });
            setIsSaving(false);
          }
        }, 700);
      };

      if (isFinished) {
        const finalScore = Math.round((correctCount / shuffledItems.length) * 100);
        return (
          <div className="max-w-md mx-auto pt-16 px-4 text-center">

    // --- GAME 3: MENGURUTKAN LANGKAH / POHON ---
    const OrderedSequenceGame = ({ title, instruction, steps, labelKey, chapterId, gameModeName, db, appId, user, profile, onBack, onFinish }) => {
      const safeSteps = useMemo(() => (Array.isArray(steps) ? steps : []), [steps]);
      const shuffledSteps = useMemo(() => {
        const copy = [...safeSteps];
        for (let i = copy.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [copy[i], copy[j]] = [copy[j], copy[i]];
        }
        return copy;
      }, [safeSteps]);

      const [selectedSteps, setSelectedSteps] = useState([]);
      const [wrongMsg, setWrongMsg] = useState('');
      const [isFinished, setIsFinished] = useState(false);
      const [isSaving, setIsSaving] = useState(false);

      if (safeSteps.length === 0) {
        return (
          <div className="max-w-md mx-auto pt-16 px-4 text-center">
            <Card>
              <p className="font-bold text-gray-600 mb-4">Data permainan sedang disiapkan.</p>
              <Button onClick={onBack} className="w-full">Kembali</Button>
            </Card>
          </div>
        );
      }

      const handlePick = async (item) => {
        const expectedOrder = selectedSteps.length + 1;
        const itemOrder = item.order || item.step;

        if (itemOrder === expectedOrder) {
          const nextSelected = [...selectedSteps, item];
          setSelectedSteps(nextSelected);
          setWrongMsg('');

          if (nextSelected.length === safeSteps.length) {
            setIsFinished(true);
            setIsSaving(true);
            await saveRecord(db, appId, 'scores', {
              userId: user?.uid || getDeviceId(),
              studentName: profile.fullName,
              grade: profile.grade,
              chapterId,
              type: 'game',
              gameMode: gameModeName,
              score: 100,
              timestamp: Date.now()
            });
            setIsSaving(false);
          }
        } else {
          setWrongMsg(`Belum tepat! Pilih urutan ke-${expectedOrder} terlebih dahulu ya.`);
        }
      };

      if (isFinished) {
        return (
          <div className="max-w-md mx-auto pt-16 px-4 text-center">
            <Card className="border-4 border-emerald-200">
              <div className="text-7xl mb-3">🌳🏆</div>
              <h2 className="text-2xl sm:text-3xl font-black text-emerald-900 mb-2">Urutan Sempurna!</h2>
              <p className="text-gray-600 mb-4">Kamu berhasil menyusun seluruh urutan dengan benar!</p>
              <div className="text-6xl font-black text-amber-500 mb-6">100</div>

                  <Button variant="secondary" onClick={onBack} className="w-full">Pilih Game Lainnya</Button>
                  <Button variant="outline" onClick={onFinish} className="w-full">Kembali ke Bab</Button>
                </div>
              )}
            </Card>
          </div>
        );
      }

      return (
        <div className="max-w-3xl mx-auto pt-6 px-4 pb-12">
          <Header title={title} subtitle={`Tersusun: ${selectedSteps.length} / ${safeSteps.length}`} onBack={onBack} />
          <p className="text-center text-xs sm:text-sm font-bold text-gray-700 bg-white p-3 rounded-2xl border border-emerald-100 mb-4">
            {instruction}
          </p>

            <div className="mb-4 bg-red-100 border border-red-300 text-red-800 text-xs sm:text-sm font-bold p-3 rounded-2xl text-center">
              ⚠️ {wrongMsg}
            </div>
          )}

          {/* Slot yang sudah tersusun */}
          <div className="bg-emerald-50 border-2 border-emerald-200 rounded-3xl p-4 mb-6 space-y-2">
            <h4 className="font-black text-emerald-900 text-xs uppercase tracking-wider mb-2">Urutan Jawabanmu:</h4>
            {safeSteps.map((_, idx) => {
              const filled = selectedSteps[idx];
              return (
                <div
                  key={idx}
                  className={`p-3 rounded-2xl border-2 flex items-center gap-3 ${
                    filled
                      ? 'bg-white border-emerald-400 text-emerald-950 font-extrabold shadow-2xs'
                      : 'bg-emerald-100/50 border-dashed border-emerald-300 text-emerald-600 font-semibold'
                  }`}
                >
                  <span className="bg-emerald-600 text-white font-black w-7 h-7 rounded-xl flex items-center justify-center text-xs shrink-0">
                    {idx + 1}
                  </span>
                  <span className="text-xs sm:text-sm">
                    {filled ? filled[labelKey] : `Pilih urutan ke-${idx + 1}...`}
                  </span>
                </div>
              );
            })}
          </div>

          {/* Pilihan acak */}
          <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
            {shuffledSteps.map((item, idx) => {
              const itemOrder = item.order || item.step;
              const isUsed = selectedSteps.some((s) => (s.order || s.step) === itemOrder);
              if (isUsed) return null;
              return (
                <button
                  key={idx}
                  onClick={() => handlePick(item)}
                  className="bg-white hover:bg-amber-50 border-2 border-amber-300 text-gray-900 font-bold p-4 rounded-2xl text-left text-xs sm:text-sm shadow-2xs transition active:scale-95 cursor-pointer"
                >
                  {item[labelKey]}
                </button>
              );
            })}
          </div>
        </div>
      );
    };

    // --- GAME KHUSUS BAB 1-1: KELOMPOKKAN 3 HARAKAT DALAM KOTAK ---
    const HarakatThreeGroupGame = ({ items, chapterId, db, appId, user, profile, onBack, onFinish }) => {
      const safeItems = useMemo(() => (Array.isArray(items) ? items : []), [items]);
      const shuffled = useMemo(() => [...safeItems].sort(() => Math.random() - 0.5), [safeItems]);

      const [selectedCard, setSelectedCard] = useState(null);
      const [placedItems, setPlacedItems] = useState({
        FATHAH: [],
        KASRAH: [],
        DAMMAH: []
      });
      const [feedback, setFeedback] = useState(null);
      const [done, setDone] = useState(false);
      const [saving, setSaving] = useState(false);

      const placedIds = useMemo(() => {
        const set = new Set();
        Object.values(placedItems).forEach((arr) => arr.forEach((it) => set.add(it.id)));
        return set;
      }, [placedItems]);

      const remainingCards = useMemo(
        () => shuffled.filter((it) => !placedIds.has(it.id)),
        [shuffled, placedIds]
      );

      const placeCardIntoBox = async (card, targetGroup) => {
        if (!card || placedIds.has(card.id)) return;

        if (card.group === targetGroup) {
          const nextPlaced = {
            ...placedItems,
            [targetGroup]: [...placedItems[targetGroup], card]
          };
          setPlacedItems(nextPlaced);
          setSelectedCard(null);
          setFeedback({ type: 'ok', text: `Tepat sekali! Huruf "${card.char}" termasuk harakat ${targetGroup}.` });

          const totalNow =
            nextPlaced.FATHAH.length + nextPlaced.KASRAH.length + nextPlaced.DAMMAH.length;

          if (totalNow === shuffled.length && shuffled.length > 0) {
            setTimeout(async () => {
              setDone(true);
              setSaving(true);
              await saveRecord(db, appId, 'scores', {
                userId: user?.uid || getDeviceId(),
                studentName: profile.fullName,
                grade: profile.grade,
                chapterId,
                type: 'game',
                gameMode: 'Kelompokkan Harakat',
                score: 100,
                timestamp: Date.now()
              });
              setSaving(false);
            }, 600);
          }

          setFeedback({
            type: 'no',
            text: `Belum tepat! Perhatikan letak tanda baca pada huruf "${card.char}", lalu pilih kotak yang sesuai.`

              <p className="text-gray-400 animate-pulse">Menyimpan skor...</p>

                {feedback.type === 'ok' ? '✅ ' : '⚠️ '}
                {feedback.text}
              </p>
            )}
          </div>

          {/* 3 Kotak Pengelompokan Harakat */}
          <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
            {boxes.map((box) => {
              const itemsInBox = placedItems[box.key] || [];
              return (
                <div
                  key={box.key}
                  onDragOver={(e) => e.preventDefault()}
                  onDrop={(e) => {
                    e.preventDefault();
                    const draggedId = e.dataTransfer.getData('text/plain');
                    const found = shuffled.find((it) => it.id === draggedId) || selectedCard;
                    placeCardIntoBox(found, box.key);
                  }}
                  onClick={() => {
                    if (selectedCard) placeCardIntoBox(selectedCard, box.key);
                  }}
                  className={`rounded-3xl border-4 ${box.bg} p-4 min-h-[210px] flex flex-col transition shadow-sm ${
                    selectedCard ? 'cursor-pointer hover:scale-[1.02] ring-2 ring-offset-2 ring-amber-400' : ''
                  }`}
                >
                  <div className={`${box.headerBg} rounded-2xl p-3 text-center mb-3 shadow-2xs`}>
                    <div className="font-black text-base sm:text-lg">{box.title}</div>
                    <div className="text-[11px] font-bold opacity-90">{box.hint}</div>
                  </div>

                  <div className="flex-1 flex flex-wrap content-start justify-center gap-2.5 p-2 rounded-2xl bg-white/60 border-2 border-dashed border-gray-300">
                    {itemsInBox.length === 0 ? (
                      <div className="my-auto text-center text-xs font-bold text-gray-400 py-6">
                        {selectedCard ? 'Klik kotak ini untuk memasukkan huruf!' : 'Kotak masih kosong'}
                      </div>
                    ) : (
                      itemsInBox.map((it) => (
                        <div

                          className={`w-14 h-14 rounded-2xl border-2 ${box.badgeBg} flex items-center justify-center text-3xl font-black shadow-xs`}

                          {it.char}

                  </div>
                </div>
              );

          </div>

          {/* Kumpulan Kartu Huruf Hijaiyah */}
          <div className="bg-white rounded-3xl p-5 border-2 border-emerald-200 shadow-sm">

            <div className="flex flex-wrap justify-center gap-3">
              {remainingCards.map((item) => {
                const isSelected = selectedCard?.id === item.id;
                return (
                  <button
                    key={item.id}
                    type="button"
                    draggable
                    onDragStart={(e) => {
                      e.dataTransfer.setData('text/plain', item.id);
                      setSelectedCard(item);
                    }}
                    onClick={() => {
                      setSelectedCard(isSelected ? null : item);
                      setFeedback(null);
                    }}
                    className={`w-16 h-16 sm:w-20 sm:h-20 rounded-2xl border-3 text-3xl sm:text-4xl font-black transition cursor-pointer flex items-center justify-center shadow-sm ${
                      isSelected
                        ? 'bg-amber-300 border-amber-600 text-amber-950 scale-110 ring-4 ring-amber-200'
                        : 'bg-emerald-50 hover:bg-amber-50 border-emerald-300 text-emerald-950'
                    }`}
                  >
                    {item.char}
                  </button>
                );
              })}
            </div>
          </div>
        </div>
      );
    };

    // --- GAME KHUSUS BAB 1-2: POHON 6 RUKUN IMAN ---
    const RukunImanTreeGame = ({ slots, chapterId, db, appId, user, profile, onBack, onFinish }) => {
      const safeSlots = useMemo(() => (Array.isArray(slots) ? slots : []), [slots]);
      const shuffledCards = useMemo(() => [...safeSlots].sort(() => Math.random() - 0.5), [safeSlots]);

      const [selectedCard, setSelectedCard] = useState(null);
      const [filledOrders, setFilledOrders] = useState({});
      const [feedback, setFeedback] = useState(null);
      const [done, setDone] = useState(false);
      const [saving, setSaving] = useState(false);

      const handlePlaceOnSlot = async (card, targetOrder) => {
        if (!card || filledOrders[targetOrder]) return;
        const expectedNext = Object.keys(filledOrders).length + 1;
        if (targetOrder !== expectedNext) {
          setFeedback({
            type: 'no',
            text: `Pasang buah Rukun Iman secara berurutan mulai dari nomor ${expectedNext} terlebih dahulu ya!`
          });
          return;
        }
        if (card.order === targetOrder) {
          const nextFilled = { ...filledOrders, [targetOrder]: card };
          setFilledOrders(nextFilled);
          setSelectedCard(null);
          setFeedback({
            type: 'ok',
            text: `Tepat sekali! Rukun Iman ke-${targetOrder} adalah Iman kepada ${card.label}.`
          });

          if (Object.keys(nextFilled).length === safeSlots.length && safeSlots.length > 0) {
            setTimeout(async () => {
              setDone(true);
              setSaving(true);
              await saveRecord(db, appId, 'scores', {
                userId: user?.uid || getDeviceId(),
                studentName: profile.fullName,
                grade: profile.grade,
                chapterId,
                type: 'game',
                gameMode: 'Pohon 6 Rukun Iman',
                score: 100,
                timestamp: Date.now()
              });
              setSaving(false);
            }, 600);
          }
        } else {
          setFeedback({
            type: 'no',
            text: `Belum tepat! "${card.label}" bukan Rukun Iman ke-${targetOrder}. Coba kartu lainnya!`
          });
        }
      };

      if (done) {
        return (
          <div className="max-w-md mx-auto pt-16 px-4 text-center">
            <Card className="border-4 border-emerald-200">
              <div className="text-7xl mb-3">🌳🏆</div>
              <h2 className="text-2xl font-black text-emerald-900 mb-2">Pohon Iman Berbuah Lebat!</h2>
              <p className="text-gray-600 mb-3">Kamu berhasil menyusun 6 Rukun Iman secara berurutan di atas pohon!</p>
              <div className="text-6xl font-black text-amber-500 mb-6">100</div>
              {saving ? (
                <p className="text-gray-400 animate-pulse">Menyimpan skor ke Guru...</p>
              ) : (
                <div className="space-y-3">
                  <Button variant="secondary" onClick={onBack} className="w-full">Pilih Game Lainnya</Button>
                  <Button variant="outline" onClick={onFinish} className="w-full">Kembali ke Bab</Button>
                </div>
              )}
            </Card>
          </div>
        );
      }

      const canopyRows = [
        [1, 2],
        [3, 4],
        [5, 6]
      ];

      return (
        <div className="max-w-3xl mx-auto pt-6 px-4 pb-12">
          <Header
            title="Pohon 6 Rukun Iman"
            subtitle={`Buah Terpasang: ${Object.keys(filledOrders).length} / ${safeSlots.length}`}
            onBack={onBack}
          />

          <div className="bg-white rounded-2xl p-3.5 border border-emerald-200 text-center shadow-2xs mb-5">
            <p className="text-xs sm:text-sm font-extrabold text-gray-700">

              <span className="bg-white/90 text-emerald-900 font-black text-xs sm:text-sm px-4 py-1 rounded-full border border-emerald-300 shadow-2xs">

              <span className="text-3xl sm:text-4xl">☀️</span>

                <div
                  key={rIdx}
                  className={`grid grid-cols-1 sm:grid-cols-2 gap-3 sm:gap-5 ${
                    rIdx === 0 ? 'sm:px-10' : rIdx === 1 ? 'sm:px-4' : ''
                  }`}
                >
                  {rowOrders.map((orderNum) => {
                    const filledCard = filledOrders[orderNum];
                    return (
                      <div
                        key={orderNum}
                        onDragOver={(e) => e.preventDefault()}
                        onDrop={(e) => {
                          e.preventDefault();
                          const draggedOrder = Number(e.dataTransfer.getData('text/plain'));
                          const found = safeSlots.find((s) => s.order === draggedOrder) || selectedCard;
                          handlePlaceOnSlot(found, orderNum);
                        }}
                        onClick={() => {
                          if (selectedCard && !filledCard) {
                            handlePlaceOnSlot(selectedCard, orderNum);
                          }
                        }}
                        className={`rounded-2xl p-3.5 border-3 transition flex items-center gap-3 ${
                          filledCard
                            ? 'bg-gradient-to-r from-amber-300 to-yellow-400 border-amber-700 text-emerald-950 shadow-md'

                              : 'bg-amber-400 text-emerald-950'
                          }`}
                        >
                          {orderNum}
                        </span>

                          {filledCard ? (
                            <div className="font-black text-sm sm:text-base flex items-center justify-between gap-1">
                              <span>🍎 {filledCard.label}</span>
                              <span>✅</span>
                            </div>
                          ) : (
                            <div className="text-xs sm:text-sm font-extrabold opacity-90">
                              {selectedCard ? `Pasang di Buah ke-${orderNum}` : `Rukun Iman ke-${orderNum}`}
                            </div>
                          )}
                        </div>
                      </div>
                    );
                  })}
                </div>
              ))}

            <div className="flex flex-col items-center -mt-1">

              </div>
              <div className="w-full max-w-md bg-lime-600 text-white text-center font-black text-xs py-1.5 px-4 rounded-full border-2 border-lime-800 shadow-xs">
                🌱 Akar Keyakinan Hati Seorang Muslim 🌱
              </div>
            </div>
          </div>

          <div className="bg-white rounded-3xl p-5 border-2 border-emerald-200 shadow-sm">
            <h3 className="text-center font-black text-emerald-950 text-sm uppercase tracking-wider mb-3">

            <div className="grid grid-cols-2 sm:grid-cols-3 gap-3">
              {shuffledCards.map((item) => {

                const isSelected = selectedCard?.order === item.order;
                if (isAlreadyPlaced) return null;

                return (
                  <button
                    key={item.order}
                    type="button"
                    draggable
                    onDragStart={(e) => {
                      e.dataTransfer.setData('text/plain', String(item.order));
                      setSelectedCard(item);

                    onClick={() => {
                      setSelectedCard(isSelected ? null : item);
                      setFeedback(null);

                    className={`p-3.5 rounded-2xl border-2 font-black text-xs sm:text-sm text-center transition cursor-pointer shadow-2xs ${
                      isSelected
                        ? 'bg-amber-300 border-amber-600 text-amber-950 scale-105 ring-4 ring-amber-200'
                        : 'bg-emerald-50 hover:bg-amber-50 border-emerald-300 text-emerald-950'
                    }`}
                  >
                    🍎 {item.label}
                  </button>
                );
              })}
            </div>
          </div>
        </div>
      );

    // --- GAME KHUSUS PETUALANGAN STUDI KASUS ---

          <div className="max-w-md mx-auto pt-16 px-4 text-center">

              <p className="font-bold text-gray-600 mb-4">Data petualangan sedang disiapkan.</p>
              <Button onClick={onBack} className="w-full">Kembali</Button>
            </Card>
          </div>
        );
      }

      const currentScene = safeScenarios[stepIdx];

      const handleChooseOption = (optIdx) => {
        if (selectedOpt !== null) return;
        setSelectedOpt(optIdx);
        if (optIdx === currentScene.ans) {
          setCorrectCount((c) => c + 1);
        }
      };

      const handleNextStep = async () => {
        if (stepIdx < safeScenarios.length - 1) {
          setStepIdx((s) => s + 1);
          setSelectedOpt(null);
        } else {
          const finalScore = Math.round((correctCount / safeScenarios.length) * 100);
          setIsFinished(true);
          setIsSaving(true);
          await saveRecord(db, appId, 'scores', {
            userId: user?.uid || getDeviceId(),
            studentName: profile.fullName,
            grade: profile.grade,
            chapterId,
            type: 'game',
            gameMode: gameModeName,
            score: finalScore,
            timestamp: Date.now()
          });
          setIsSaving(false);
        }
      };

      if (isFinished) {
        const finalScore = Math.round((correctCount / safeScenarios.length) * 100);
        return (
          <div className="max-w-md mx-auto pt-16 px-4 text-center">

              <div className="text-7xl mb-3">🧭🏆</div>

                <p className="text-gray-400 animate-pulse">Menyimpan skor ke Guru...</p>
              ) : (
                <div className="space-y-3">
                  <Button variant="secondary" onClick={onBack} className="w-full">Pilih Game Lainnya</Button>
                  <Button variant="outline" onClick={onFinish} className="w-full">Kembali ke Bab</Button>
                </div>
              )}
            </Card>
          </div>
        );
      }

      const isCorrectChoice = selectedOpt === currentScene.ans;

      return (
        <div className="max-w-2xl mx-auto pt-6 px-4 pb-12">
          <Header
            title={title}
            subtitle={`Petualangan ${stepIdx + 1} dari ${safeScenarios.length} • Bintang: ${correctCount}`}
            onBack={onBack}
          />

          <Card className="border-4 border-amber-200">
            <div className="text-center mb-5">
              <span className="inline-block bg-amber-100 text-amber-950 font-black text-xs px-3.5 py-1 rounded-full mb-3">
                {currentScene.badge}
              </span>
              <div className="text-6xl mb-3">{currentScene.icon}</div>
              <h3 className="text-base sm:text-xl font-black text-gray-900 leading-relaxed">
                {currentScene.situation}
              </h3>
            </div>

            <div className="space-y-3">
              {currentScene.options.map((opt, idx) => {
                let btnStyle = 'bg-amber-50/70 border-amber-200 hover:border-amber-500 text-gray-900';
                if (selectedOpt !== null) {
                  if (idx === currentScene.ans) {
                    btnStyle = 'bg-emerald-600 border-emerald-800 text-white shadow-md';
                  } else if (idx === selectedOpt) {
                    btnStyle = 'bg-red-500 border-red-700 text-white';
                  } else {
                    btnStyle = 'bg-gray-100 border-gray-200 text-gray-400';
                  }
                }

                return (
                  <button
                    key={idx}
                    disabled={selectedOpt !== null}
                    onClick={() => handleChooseOption(idx)}
                    className={`w-full p-4 rounded-2xl border-2 text-left font-bold text-xs sm:text-sm transition cursor-pointer ${btnStyle}`}
                  >
                    {String.fromCharCode(65 + idx)}. {opt}
                  </button>
                );
              })}
            </div>

            {selectedOpt !== null && (
              <div className="mt-5 space-y-4">
                <div
                  className={`p-4 rounded-2xl border-2 text-xs sm:text-sm font-extrabold ${
                    isCorrectChoice
                      ? 'bg-emerald-50 border-emerald-300 text-emerald-900'
                      : 'bg-amber-50 border-amber-300 text-amber-950'
                  }`}
                >
                  {isCorrectChoice ? '🌟 Tepat Sekali! ' : '💡 Yuk Belajar Bersama: '}
                  {currentScene.feedback}
                </div>

                <Button onClick={handleNextStep} className="w-full">
                  {stepIdx < safeScenarios.length - 1 ? 'Lanjut ke Petualangan Berikutnya →' : 'Lihat Hasil Petualangan 🏆'}
                </Button>
              </div>
            )}
          </Card>
        </div>
      );
    };

    // --- GAME KHUSUS BAB 2-2: MEWARNAI KALIGRAFI ASMAULHUSNA ---
    const AsmaColoringGame = ({ chapterId, db, appId, user, profile, onBack, onFinish }) => {
      const asmaCards = [
        {

        },

          id: 'al-alim',
          arabic: 'اَلْعَلِيْمُ',

        {

          arabic: 'اَلْخَبِيْرُ',

      const paletteColors = [
        { name: 'Hijau Zamrud', hex: '#10B981' },
        { name: 'Hijau Daun', hex: '#22C55E' },

        { name: 'Biru Laut', hex: '#2563EB' },

        { name: 'Merah Mawar', hex: '#EF4444' },
        { name: 'Merah Muda', hex: '#EC4899' },

      const defaultFills = {
        frameOuter: '#F8FAFC',

      const [warnMsg, setWarnMsg] = useState('');
      const [isFinished, setIsFinished] = useState(false);
      const [isSaving, setIsSaving] = useState(false);

      const currentCard = asmaCards[cardIdx];
      const currentFills = fillsByCard[cardIdx] || defaultFills;

      const handlePaintPart = (partKey) => {
        setFillsByCard((prev) => ({
          ...prev,
          [cardIdx]: {
            ...(prev[cardIdx] || defaultFills),
            [partKey]: selectedColor
          }
        }));
        setColoredCountByCard((prev) => ({
          ...prev,
          [cardIdx]: (prev[cardIdx] || 0) + 1
        }));
        setWarnMsg('');
      };

      const handleResetCurrent = () => {
        setFillsByCard((prev) => ({
          ...prev,
          [cardIdx]: { ...defaultFills }
        }));
        setColoredCountByCard((prev) => ({
          ...prev,
          [cardIdx]: 0
        }));
      };

      const handleDownloadArtwork = () => {
        const svgEl = document.getElementById('asma-coloring-svg');
        if (!svgEl) return;
        try {
          const serializer = new XMLSerializer();
          const svgStr = serializer.serializeToString(svgEl);
          const svgBlob = new Blob([svgStr], { type: 'image/svg+xml;charset=utf-8' });
          const url = URL.createObjectURL(svgBlob);
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            canvas.width = 960;
            canvas.height = 680;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#FFFFFF';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            URL.revokeObjectURL(url);
            const pngUrl = canvas.toDataURL('image/png');
            const a = document.createElement('a');
            a.href = pngUrl;
            a.download = `Kaligrafi_${currentCard.latin}_${profile.fullName.replace(/\s+/g, '_')}.png`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
          };
          img.src = url;
        } catch (e) {
          console.warn('Download artwork warning:', e);
        }
      };

      const handleFinishColoring = async () => {
        const totalColoredActions = Object.values(coloredCountByCard).reduce((a, b) => a + b, 0);
        if (totalColoredActions < 3) {
          setWarnMsg('Ayo warnai minimal 3 bagian pada kaligrafi Asmaulhusna terlebih dahulu ya!');
          return;
        }
        setIsFinished(true);
        setIsSaving(true);
        await saveRecord(db, appId, 'scores', {
          userId: user?.uid || getDeviceId(),
          studentName: profile.fullName,
          grade: profile.grade,
          chapterId,
          type: 'game',
          gameMode: 'Mewarnai Kaligrafi Asmaulhusna',

          timestamp: Date.now()

        return (

              <h2 className="text-2xl sm:text-3xl font-black text-teal-900 mb-2">Karya Kaligrafi Indah!</h2>
              <p className="text-gray-600 mb-4">Kamu sudah mewarnai kaligrafi Asmaulhusna dengan penuh kreativitas!</p>
              <div className="text-6xl font-black text-amber-500 mb-6">100</div>
              {isSaving ? (
                <p className="text-gray-400 animate-pulse">Menyimpan skor ke Guru...</p>
              ) : (
                <div className="space-y-3">
                  <Button variant="secondary" onClick={onBack} className="w-full">Pilih Game Lainnya</Button>
                  <Button variant="outline" onClick={onFinish} className="w-full">Kembali ke Bab</Button>
                </div>
              )}

          </div>

      return (
        <div className="max-w-4xl mx-auto pt-6 px-4 pb-12">
          <Header
            title="Mewarnai Kaligrafi Asmaulhusna"
            subtitle="Pilih warna di palet, lalu sentuh bagian bingkai, kubah, bintang, atau huruf kaligrafi!"
            onBack={onBack}
          />

          <div className="grid grid-cols-2 sm:grid-cols-4 gap-2.5 mb-4">
            {asmaCards.map((c, idx) => (
              <button
                key={c.id}
                onClick={() => setCardIdx(idx)}
                className={`p-3 rounded-2xl border-2 text-center font-extrabold transition cursor-pointer ${
                  cardIdx === idx
                    ? 'bg-teal-600 border-teal-800 text-white shadow-md'
                    : 'bg-white border-teal-200 text-teal-950 hover:bg-teal-50'
                }`}
              >
                <div className="text-xl font-black" dir="rtl">{c.arabic}</div>
                <div className="text-xs mt-0.5">{c.latin}</div>
              </button>
            ))}
          </div>

          {warnMsg && (
            <div className="mb-4 bg-amber-100 border border-amber-300 text-amber-900 text-xs sm:text-sm font-bold p-3 rounded-2xl text-center">
              🎨 {warnMsg}
            </div>
          )}

          <div className="grid grid-cols-1 lg:grid-cols-12 gap-5 items-start">
            <div className="lg:col-span-8 bg-white rounded-3xl p-4 shadow-md border-4 border-teal-200">
              <svg
                id="asma-coloring-svg"
                viewBox="0 0 600 425"
                className="w-full h-auto rounded-2xl select-none"
              >
                <rect
                  x="8"
                  y="8"
                  width="584"
                  height="409"
                  rx="28"
                  fill={currentFills.frameOuter}
                  stroke="#0F172A"
                  strokeWidth="4"
                  onClick={() => handlePaintPart('frameOuter')}
                  className="cursor-pointer transition-colors"
                />

                <rect
                  x="28"
                  y="28"
                  width="544"
                  height="369"
                  rx="22"
                  fill={currentFills.frameInner}
                  stroke="#0F172A"
                  strokeWidth="3.5"
                  onClick={() => handlePaintPart('frameInner')}
                  className="cursor-pointer transition-colors"
                />

                <path
                  d="M120 315 V175 C120 80 480 80 480 175 V315 Z"
                  fill={currentFills.dome}
                  stroke="#0F172A"
                  strokeWidth="4"
                  onClick={() => handlePaintPart('dome')}
                  className="cursor-pointer transition-colors"
                />

                <circle
                  cx="300"
                  cy="64"
                  r="24"
                  fill={currentFills.topCrest}
                  stroke="#0F172A"
                  strokeWidth="3.5"
                  onClick={() => handlePaintPart('topCrest')}
                  className="cursor-pointer transition-colors"
                />
                <text x="300" y="71" textAnchor="middle" fontSize="20" pointerEvents="none">🌙</text>

                <polygon
                  points="76,72 84,92 106,92 88,105 95,126 76,113 57,126 64,105 46,92 68,92"
                  fill={currentFills.starLeft}
                  stroke="#0F172A"
                  strokeWidth="3"
                  onClick={() => handlePaintPart('starLeft')}
                  className="cursor-pointer transition-colors"
                />

                <polygon
                  points="524,72 532,92 554,92 536,105 543,126 524,113 505,126 512,105 494,92 516,92"
                  fill={currentFills.starRight}
                  stroke="#0F172A"
                  strokeWidth="3"
                  onClick={() => handlePaintPart('starRight')}
                  className="cursor-pointer transition-colors"
                />

                <text
                  x="300"
                  y="235"
                  textAnchor="middle"
                  fontSize="94"
                  fontWeight="900"
                  fill={currentFills.calligraphy}
                  stroke="#0F172A"
                  strokeWidth="3"
                  paintOrder="stroke"
                  onClick={() => handlePaintPart('calligraphy')}
                  className="cursor-pointer transition-colors"
                >
                  {currentCard.arabic}
                </text>

                <rect
                  x="85"
                  y="324"
                  width="430"
                  height="54"
                  rx="18"
                  fill={currentFills.ribbon}
                  stroke="#0F172A"
                  strokeWidth="3.5"
                  onClick={() => handlePaintPart('ribbon')}
                  className="cursor-pointer transition-colors"
                />
                <text

                  y="347"
                  textAnchor="middle"
                  fontSize="16"
                  fontWeight="900"

                  pointerEvents="none"

                <text

                  y="367"
                  textAnchor="middle"
                  fontSize="13"
                  fontWeight="700"

                  pointerEvents="none"

              <p className="text-center text-xs font-bold text-gray-500 mt-2">

              </p>

            <div className="lg:col-span-4 bg-white rounded-3xl p-5 shadow-md border-2 border-teal-100 space-y-4">
              <div>

                <div className="grid grid-cols-4 gap-2.5">
                  {paletteColors.map((col) => {
                    const isPicked = selectedColor === col.hex;
                    return (
                      <button

                        type="button"
                        title={col.name}
                        onClick={() => setSelectedColor(col.hex)}

                            ? 'border-gray-900 scale-110 shadow-md ring-2 ring-teal-400'

                  type="button"

              <div className="pt-2">
                <Button onClick={handleFinishColoring} className="w-full text-sm py-3.5">

          </div>
        </div>
      );
    };

    // --- ASESMEN PER BAB (10 SOAL PILIHAN GANDA) ---
    const Assessment = ({ chapter, db, appId, user, profile, onBack, cloudStatus }) => {
      const questions = CHAPTER_DATA[chapter.id]?.assessment || [];
      const [answers, setAnswers] = useState({});
      const [submitted, setSubmitted] = useState(false);
      const [score, setScore] = useState(0);
      const [isSaving, setIsSaving] = useState(false);
      const [syncResult, setSyncResult] = useState(null);
      const [errorMsg, setErrorMsg] = useState('');

      const handleSubmit = async () => {
        if (Object.keys(answers).length < questions.length) {
          setErrorMsg(`Masih ada soal yang belum dijawab (${Object.keys(answers).length}/${questions.length}). Lengkapi semua dulu ya!`);
          return;
        }
        setErrorMsg('');
        let correct = 0;
        questions.forEach((q, idx) => {
          if (answers[idx] === q.ans) correct++;
        });
        const finalScore = Math.round((correct / questions.length) * 100);
        setScore(finalScore);
        setSubmitted(true);
        setIsSaving(true);

        const res = await saveRecord(db, appId, 'scores', {
          userId: user?.uid || getDeviceId(),
          studentName: profile.fullName,
          grade: profile.grade,
          chapterId: chapter.id,
          chapterTitle: chapter.title,
          type: 'assessment',
          score: finalScore,
          correctCount: correct,
          totalQuestions: questions.length,
          timestamp: Date.now()
        });
        setSyncResult(res);
        setIsSaving(false);
      };

      if (submitted) {
        return (
          <div className="max-w-lg mx-auto pt-12 px-4 pb-12 text-center">
            <Card className="border-4 border-sky-200">
              <div className="text-7xl mb-3">{score >= 70 ? '🌟🎉' : '💪📖'}</div>
              <h2 className="text-2xl sm:text-3xl font-black text-emerald-950 mb-1">Hasil Asesmen Bab {chapter.number}</h2>
              <p className="text-sm font-bold text-gray-600 mb-4">{profile.fullName} • Kelas {profile.grade}</p>
              <div className="text-6xl font-black text-sky-600 mb-4">{score}</div>

              {isSaving ? (
                <p className="text-sm text-gray-500 animate-pulse mb-6">Mengirim nilai ke Dashboard Guru...</p>
              ) : (
                <div className={`mb-6 p-3.5 rounded-2xl border text-xs font-extrabold ${
                  syncResult?.synced
                    ? 'bg-emerald-50 border-emerald-200 text-emerald-800'
                    : 'bg-amber-50 border-amber-200 text-amber-800'
                }`}>
                  {syncResult?.synced
                    ? '☁️ Alhamdulillah! Nilai kamu sudah otomatis terkirim dan tersimpan di Dashboard Guru!'
                    : '💾 Nilai tersimpan di perangkat ini dan akan otomatis terkirim ke Dashboard Guru saat terhubung Cloud!'}
                </div>
              )}

              <Button onClick={onBack} className="w-full">Kembali ke Menu Bab</Button>
            </Card>
          </div>
        );
      }

      return (
        <div className="max-w-3xl mx-auto pt-6 px-4 pb-12">
          <Header
            title={`Asesmen Bab ${chapter.number}: ${chapter.title}`}
            subtitle={`${profile.fullName} (Kelas ${profile.grade}) • ${questions.length} Soal`}
            onBack={onBack}
          />

          <div className="space-y-5">
            {questions.map((q, qIdx) => (
              <Card key={qIdx}>
                <p className="font-black text-gray-900 text-base sm:text-lg mb-4">
                  {qIdx + 1}. {q.q}
                </p>
                <div className="space-y-2.5">
                  {q.options.map((opt, optIdx) => {
                    const isPicked = answers[qIdx] === optIdx;
                    return (
                      <button
                        key={optIdx}
                        onClick={() => {
                          setAnswers({ ...answers, [qIdx]: optIdx });
                          setErrorMsg('');
                        }}
                        className={`w-full p-3.5 rounded-2xl border-2 text-left font-bold text-sm sm:text-base transition cursor-pointer ${
                          isPicked
                            ? 'bg-sky-600 border-sky-700 text-white shadow-sm'
                            : 'bg-gray-50 border-gray-200 hover:border-sky-400 text-gray-800'
                        }`}
                      >
                        {String.fromCharCode(65 + optIdx)}. {opt}
                      </button>
                    );
                  })}
                </div>
              </Card>
            ))}
          </div>

          {errorMsg && (
            <div className="mt-6 bg-red-100 border border-red-300 text-red-800 font-bold text-sm p-3.5 rounded-2xl text-center">
              ⚠️ {errorMsg}
            </div>
          )}

          <div className="mt-8">
            <Button onClick={handleSubmit} className="w-full text-lg py-4">
              Kumpulkan Jawaban & Kirim ke Guru 🚀
            </Button>
          </div>
        </div>
      );
    };

    // --- ASESMEN AKHIR SEMESTER (AAS: PILIHAN GANDA & ESAI) ---
    const AASViewer = ({ profile, db, appId, user, onBack }) => {
      const data = AAS_DATA[profile.grade] || AAS_DATA['1'];
      const [mcAnswers, setMcAnswers] = useState({});
      const [essayAnswers, setEssayAnswers] = useState({});
      const [submitted, setSubmitted] = useState(false);
      const [mcScore, setMcScore] = useState(0);
      const [isSaving, setIsSaving] = useState(false);
      const [syncResult, setSyncResult] = useState(null);
      const [errorMsg, setErrorMsg] = useState('');

      const handleSubmit = async () => {
        if (Object.keys(mcAnswers).length < data.mcQuestions.length) {
          setErrorMsg(`Masih ada soal Pilihan Ganda yang belum dijawab (${Object.keys(mcAnswers).length}/${data.mcQuestions.length}).`);
          return;
        }
        for (let i = 0; i < data.essayQuestions.length; i++) {
          if (!essayAnswers[i] || !essayAnswers[i].trim()) {
            setErrorMsg(`Jawaban Esai nomor ${i + 1} belum diisi. Silakan tulis jawabanmu dulu ya!`);
            return;
          }
        }

        setErrorMsg('');
        let correct = 0;
        data.mcQuestions.forEach((q, idx) => {
          if (mcAnswers[idx] === q.ans) correct++;
        });
        const finalMcScore = Math.round((correct / data.mcQuestions.length) * 100);
        setMcScore(finalMcScore);
        setSubmitted(true);
        setIsSaving(true);

        const docId = `aas_${profile.grade}_${getDeviceId()}_${Date.now()}`;
        const res = await saveRecord(db, appId, 'aas_submissions', {
          userId: user?.uid || getDeviceId(),
          studentName: profile.fullName,
          grade: profile.grade,
          mcScore: finalMcScore,
          mcCorrect: correct,
          mcTotal: data.mcQuestions.length,
          essayQuestions: data.essayQuestions,
          essayAnswers: data.essayQuestions.map((_, i) => essayAnswers[i].trim()),
          essayScore: null,
          finalScore: null,
          teacherNote: '',

        }, docId);

        setSyncResult(res);
        setIsSaving(false);
      };

      if (submitted) {

                <div className="text-5xl font-black text-indigo-700 my-1">{mcScore}</div>
                <p className="text-xs text-gray-600">Jawaban Esai (5 Soal) telah dikirim untuk dinilai oleh Ibu Guru.</p>
              </div>

              {isSaving ? (
                <p className="text-sm text-gray-500 animate-pulse mb-6">Mengirim lembar AAS ke Dashboard Guru...</p>

                <div className={`mb-6 p-3.5 rounded-2xl border text-xs font-extrabold ${

                    ? '☁️ Alhamdulillah! Seluruh jawaban Pilihan Ganda & Esai sudah tersimpan otomatis di Dashboard Guru!'

          <div className="bg-indigo-600 text-white rounded-2xl p-4 mb-6 shadow-sm">
            <h3 className="font-black text-base sm:text-lg">Bagian A: Pilihan Ganda ({data.mcQuestions.length} Soal)</h3>
            <p className="text-xs text-indigo-100">Pilihlah salah satu jawaban A, B, atau C yang paling tepat!</p>
          </div>

          <div className="space-y-4 mb-10">
            {data.mcQuestions.map((q, qIdx) => (
              <Card key={qIdx}>
                <p className="font-black text-gray-900 text-sm sm:text-base mb-3">
                  {qIdx + 1}. {q.q}

                <div className="space-y-2">
                  {q.options.map((opt, optIdx) => {
                    const isPicked = mcAnswers[qIdx] === optIdx;
                    return (
                      <button
                        key={optIdx}
                        onClick={() => {
                          setMcAnswers({ ...mcAnswers, [qIdx]: optIdx });
                          setErrorMsg('');
                        }}
                        className={`w-full p-3 rounded-xl border-2 text-left font-bold text-xs sm:text-sm transition cursor-pointer ${
                          isPicked
                            ? 'bg-indigo-600 border-indigo-700 text-white'
                            : 'bg-gray-50 border-gray-200 hover:border-indigo-400 text-gray-800'
                        }`}
                      >
                        {String.fromCharCode(65 + optIdx)}. {opt}
                      </button>
                    );
                  })}
                </div>
              </Card>
            ))}
          </div>

          <div className="bg-purple-600 text-white rounded-2xl p-4 mb-6 shadow-sm">
            <h3 className="font-black text-base sm:text-lg">Bagian B: Soal Esai Bernalar Kritis (5 Soal)</h3>
            <p className="text-xs text-purple-100">Tulislah jawabanmu dengan kalimat yang jelas dan santun!</p>
          </div>

          <div className="space-y-4">
            {data.essayQuestions.map((eq, idx) => (
              <Card key={idx}>
                <p className="font-black text-gray-900 text-sm sm:text-base mb-3">{eq}</p>
                <textarea
                  rows="3"

                  onChange={(e) => {
                    setEssayAnswers({ ...essayAnswers, [idx]: e.target.value });
                    setErrorMsg('');
                  }}
                  placeholder="Tulis jawabanmu di sini..."
                  className="w-full p-3.5 rounded-2xl border-2 border-purple-200 focus:border-purple-500 focus:outline-none text-sm font-semibold text-gray-800"

          {errorMsg && (

          <div className="mt-8">

    // --- MODAL LOGIN GURU ---
